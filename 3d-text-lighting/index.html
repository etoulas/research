<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Stroke Type — depth, boldness &amp; a light you can drag</title>
<style>
  :root {
    --panel: #16171d;
    --edge: #2a2c36;
    --ink: #e6e7ee;
    --dim: #8b8e9c;
    --accent: #e8b04b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0c10;
    color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 18px 10px;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; font-weight: 650; }
  header p { margin: 0; color: var(--dim); font-size: 12.5px; }

  #stagewrap { flex: 1 1 auto; min-height: 260px; padding: 0 14px; }
  canvas {
    width: 100%; height: 100%; display: block;
    border: 1px solid var(--edge); border-radius: 12px;
    touch-action: none;
  }
  canvas.grab-view { cursor: grabbing; }
  canvas.grab-light { cursor: grabbing; }

  .panel {
    margin: 12px 14px 16px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 12px;
    padding: 12px 14px 14px;
    display: flex; gap: 22px; align-items: center; flex-wrap: wrap;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; letter-spacing: .10em; text-transform: uppercase; color: var(--dim); }
  input[type=text] {
    background: #0e0f14; border: 1px solid var(--edge); border-radius: 8px;
    color: var(--ink); padding: 9px 11px; font-size: 16px; letter-spacing: .06em;
    width: 220px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }

  #knobs { display: flex; gap: 16px; flex-wrap: wrap; }
  .knob {
    width: 76px; text-align: center; user-select: none; cursor: ns-resize;
    touch-action: none;
  }
  .knob .dial { width: 56px; height: 56px; display: block; margin: 0 auto; }
  .knob .trackbg { fill: none; stroke: #24262f; stroke-width: 7; }
  .knob .track { stroke: var(--accent); stroke-width: 7; stroke-linecap: round; }
  .knob .cap circle { fill: #22242d; stroke: #33363f; stroke-width: 2; }
  .knob .cap line { stroke: #cfd2dd; stroke-width: 5; stroke-linecap: round; }
  .knob.active .cap circle { fill: #2b2e39; }
  .klabel { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-top: 4px; }
  .kval { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }

  .swatches { display: flex; gap: 7px; }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; box-shadow: 0 0 0 1px #000 inset;
  }
  .swatch.on { border-color: #fff; }
  button {
    background: #22242d; color: var(--ink); border: 1px solid var(--edge);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 12.5px;
  }
  button:hover { background: #2b2e39; }
  button.on { background: var(--accent); border-color: var(--accent); color: #17181d; font-weight: 600; }
  .hint { color: var(--dim); font-size: 12px; max-width: 260px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .check {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: #0e0f14; border: 1px solid var(--edge); border-radius: 8px;
    padding: 7px 11px; font-size: 12.5px; user-select: none;
  }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; }
  @media (max-width: 640px) { .panel { gap: 14px; } input[type=text] { width: 100%; } }
</style>
</head>
<body>

<header>
  <h1>3D Stroke Type</h1>
  <p>Drag the <strong>sun</strong> to move the light · drag anywhere else to orbit · drag knobs vertically &middot; the letters are built <strong>on the grid</strong> &mdash; a stroke is a whole number of squares, and every straight edge sits on a line</p>
</header>

<div id="stagewrap"><canvas id="stage"></canvas></div>

<div class="panel">
  <div class="field">
    <label for="text">Text</label>
    <input id="text" type="text" maxlength="24" spellcheck="false" autocomplete="off">
  </div>

  <div id="knobs"></div>

  <div class="field">
    <label>Material</label>
    <div class="swatches">
      <div class="swatch" data-c="#e8b04b"></div>
      <div class="swatch" data-c="#d8dbe4"></div>
      <div class="swatch" data-c="#5fb0ff"></div>
      <div class="swatch" data-c="#ff6f61"></div>
      <div class="swatch" data-c="#6fd08c"></div>
    </div>
  </div>

  <div class="field">
    <label>Guides</label>
    <div class="row">
      <label class="check"><input id="grid" type="checkbox" checked> Grid</label>
      <button id="front">Front on</button>
    </div>
  </div>

  <div class="field">
    <label>View</label>
    <button id="reset">Reset camera &amp; light</button>
  </div>
</div>

<script src="font.js"></script>
<script src="app.js"></script>
</body>
</html>
